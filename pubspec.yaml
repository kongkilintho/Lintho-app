name: lintho
description: LinTho Home Services
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_database: ^11.3.10
  google_sign_in: ^6.2.1

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.8

  # UI
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  flutter_svg: ^2.0.10+1

  # Media & files
  image_picker: ^1.1.2

  # Location & maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geocoding: 3.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  http: ^1.2.0
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/lintho_logo_3d.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F7F4F0"
  adaptive_icon_foreground: "assets/icons/lintho_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/lintho_logo_3d.png"
    background_color: "#0B1A4D"
    theme_color: "#0B1A4D"

flutter_native_splash:
  color: "#F7F4F0"
  image: assets/icons/lintho_splash_logo.png
  fullscreen: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#F7F4F0"
    image: assets/icons/lintho_splash_logo.png
    icon_background_color: "#F7F4F0"